name: Keep Supabase awake

# Supabase pauses free projects after a week without activity. A tiny read
# every three days keeps cloud sync available. Set the SUPABASE_URL and
# SUPABASE_PUBLISHABLE_KEY repository secrets to enable it; without them the
# job does nothing.

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the projects table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase secrets are not set; skipping."
            exit 0
          fi
          # Any answer from the API counts as activity; only a missing or
          # failing server (no response, or 5xx) fails the job.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 \
            "$SUPABASE_URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" || true)
          echo "Supabase answered with HTTP $status."
          if [ "$status" = "000" ] || [ "$status" -ge 500 ]; then exit 1; fi
