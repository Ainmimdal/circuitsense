<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CircuitSense — Intelligent Arduino Circuit Builder</title>
    <meta name="description" content="An AI-powered intelligent tutoring system for Arduino circuit design. Build circuits visually with real-time validation and smart guidance.">

    <!-- Editor typography: sans for chrome, mono only for technical readouts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/svg+xml" href="/eleraLogo.svg">

    <style>
        @font-face {
            font-family: '0xProto';
            src: url('https://cdn.jsdelivr.net/gh/0xType/0xProto@main/fonts/0xProto-Regular.woff2') format('woff2');
            font-display: swap;
            font-style: normal;
            font-weight: 400;
        }

        :root {
            --font-ui: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
            --font-tech: '0xProto', 'IBM Plex Mono', Consolas, monospace;
            --ink: #1E1E1E;
            --panel: #252526;
            --panel-border: #3C3C3C;
            --text: #E4E4E4;
            --text-muted: #8A8A8A;
            --primary: #3A3A3A;
            --primary-hover: #4A4A4A;
            --accent: #E8A33D;
            --accent-boards: #E8A33D;
            --accent-sensors: #4FA9A0;
            --accent-breadboards: #6E8CA0;
            --accent-ics: #C1666B;
            --accent-inputs: #9A83AE;
            --accent-displays: #C3866B;
            --accent-actuators: #9A9463;
            --accent-passives: #9B8A72;
            --accent-communication: #728F83;
            --accent-custom: #8D7E92;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-ui);
            background: var(--ink);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Prevent FOUC */
        circuit-app:not(:defined) {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
        }

        circuit-app:not(:defined)::before {
            content: 'Loading CircuitSense...';
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>
    <circuit-app></circuit-app>
    <script type="module" src="/src/index.js"></script>
</body>

</html>
